spring.application.name=API-GATEWAY
server.port=9001
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.cloud.gateway.discovery.locator.enabled=true

logging.level.org.springframework.cloud.gateway=${GATEWAY_LOG_LEVEL:INFO}
logging.level.reactor.netty.http.client=${HTTP_CLIENT_LOG_LEVEL:INFO}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/campconnect}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/campconnect/protocol/openid-connect/certs}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Events
springdoc.swagger-ui.urls[0].url=/openapi/events
springdoc.swagger-ui.urls[1].name=Notifications
springdoc.swagger-ui.urls[1].url=/openapi/notifications
springdoc.swagger-ui.urls[2].name=Camping
springdoc.swagger-ui.urls[2].url=/openapi/camping
springdoc.swagger-ui.urls[3].name=Users
springdoc.swagger-ui.urls[3].url=/openapi/users
springdoc.swagger-ui.urls[4].name=Products
springdoc.swagger-ui.urls[4].url=/openapi/products
